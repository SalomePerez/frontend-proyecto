<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SegurApp</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
  
  <!-- Google Maps API - CALLBACK PARA DEBUG -->
  <script>
    function initGoogleMaps() {
      console.log('🗺️ Google Maps API cargada correctamente');
      console.log('Google Maps disponible:', typeof google !== 'undefined' && google.maps);
      // Opcional: disparar evento personalizado cuando esté listo
      window.dispatchEvent(new Event('google-maps-loaded'));
    }
    
    function onGoogleMapsError() {
      console.error('❌ Error cargando Google Maps API');
    }
  </script>
  
  <script async defer
          src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6oe4yksUiP6uTnEEbHAGgBC5CKBewL6k&libraries=places,geometry&v=3.53&callback=initGoogleMaps"
          onerror="onGoogleMapsError()">
  </script>
</body>
</html>
