<form [formGroup]="crearReporteForm" (ngSubmit)="crearReporte()">
  <div>
    <label>Título: </label>
    <input type="text" formControlName="titulo" />
  </div>

  <div>
    <label>Descripción: </label>
    <textarea formControlName="descripcion"></textarea>
  </div>


<div class="col-12 col-sm-6">
   <label class="form-label">Categoría: </label>
   <select class="form-select" formControlName="categoria">
       <option value="">Seleccione una categoría</option>
       @for (item of categorias; track $index) {
           <option value="{{item}}">{{item}}</option>
       }
   </select>
</div>



<div>
  <label>Ciudad: </label>
  <select formControlName="ciudad">
    <option value="" disabled selected>Seleccione una ciudad</option>
        @for (item of ciudades; track $index) {
        <option value="{{item}}">{{item}}</option>
        }  </select>
</div>


  <div>
    <label>Ubicación: </label>
    <input type="text" formControlName="ubicacion" />
  </div>

  <div>
  <label>Imagen reporte: </label>
  <input type="file" (change)="onFileChange($event)" multiple />
</div>


  <button type="submit" [disabled]="crearReporteForm.invalid">Crear reporte</button>
</form>
