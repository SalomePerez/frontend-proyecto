<h2>Iniciar Sesión</h2>

<form [formGroup]="loginForm" (ngSubmit)="iniciarSesion()">
  <div>
    <label for="correo">Correo:</label>
    <input type="email" id="correo" formControlName="correo" />
    <div *ngIf="loginForm.get('correo')?.touched && loginForm.get('correo')?.invalid" style="color: red;">
      <small *ngIf="loginForm.get('correo')?.errors?.['required']">El correo es obligatorio.</small>
      <small *ngIf="loginForm.get('correo')?.errors?.['email']">Formato de correo no válido.</small>
    </div>
  </div>

  <div>
    <label for="contrasenia">Contraseña:</label>
    <input type="password" id="contrasenia" formControlName="contrasenia" />
    <div *ngIf="loginForm.get('contrasenia')?.touched && loginForm.get('contrasenia')?.invalid" style="color: red;">
      <small *ngIf="loginForm.get('contrasenia')?.errors?.['required']">La contraseña es obligatoria.</small>
      <small *ngIf="loginForm.get('contrasenia')?.errors?.['minlength']">
        La contraseña debe tener al menos 6 caracteres.
      </small>
    </div>
  </div>

  <button type="submit" [disabled]="loginForm.invalid">Iniciar sesión</button>
</form>
